name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: Lua ${{ matrix.lua }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # privata claims to run anywhere Lua does, so it is tested everywhere
        # Lua is. The parser accepts a superset of all of these dialects.
        lua: ["5.1", "5.2", "5.3", "5.4", "luajit"]

    steps:
      - uses: actions/checkout@v4

      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: ${{ matrix.lua }}

      - uses: leafo/gh-actions-luarocks@v4

      - name: Install test dependencies
        run: |
          luarocks install busted
          luarocks install luacov

      - name: Verify the rockspec builds
        run: luarocks make --local privata-scm-1.rockspec

      - name: Run specs
        run: busted --verbose

      # Any internal helper must either live in _P or be genuinely used across
      # modules, or this fails. Run from the tree rather than the installed rock
      # so the check covers the commit under test.
      - name: Run privata on itself
        env:
          LUA_PATH: "./lua/?.lua;./lua/?/init.lua;;"
        run: lua bin/privata.lua .

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.4"

      - uses: leafo/gh-actions-luarocks@v4

      - run: luarocks install luacheck
      - run: make luacheck

      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check lua spec bin scripts

  llscheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.4"

      - uses: leafo/gh-actions-luarocks@v4

      # llscheck drives lua-language-server, which is a separate binary.
      - uses: jdx/mise-action@v2
        with:
          tool_versions: |
            lua-language-server latest

      - run: luarocks install llscheck

      # Clones the busted and luassert LuaCATS definitions first.
      - run: make llscheck

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.4"

      - uses: leafo/gh-actions-luarocks@v4

      - name: Install test dependencies
        run: |
          luarocks install busted
          luarocks install luacov

      - name: Run specs with coverage
        run: busted --coverage

      # 92 rather than 100: _fs.lua ships three filesystem backends and only
      # one of them can execute on any given interpreter. See .luacov.
      - name: Enforce the coverage gate
        run: lua scripts/check_coverage.lua 92
